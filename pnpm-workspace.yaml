packages:
  - apps/*
  - examples
  - packages/*
  - packages/store/*
  - packages/credential-store/*
  - packages/oauth-flow-store/*
  - packages/examples/*
  - tests/*

# better-sqlite3 ships a prebuilt binding for every platform it supports, so it needs no build step.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  unrs-resolver: false
