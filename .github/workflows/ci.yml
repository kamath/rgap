name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rgap
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rgap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL adapter
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/rgap
        run: |
          pnpm --filter @rgap/store-postgres test
          pnpm --filter @rgap/credential-store-postgres test
          pnpm --filter @rgap/oauth-flow-store-postgres test
          pnpm --filter @rgap/invariant-tests test

      - name: Test invariant walkthrough
        run: pnpm --filter @rgap/examples invariants
